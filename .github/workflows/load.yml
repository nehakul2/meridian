name: load

# MER-83: nightly load and scale harness, never on pull requests. Posts a pass/fail row per
# budget to the run summary and uploads tests/load/out/report.{json,md}.
on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC, after US close and before the next morning run
  workflow_dispatch:
    inputs:
      scale:
        description: "LOAD_SCALE: multiplies requests, clients, fills and days"
        default: "5"

env:
  SOLANA_VERSION: v2.3.13

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana CLI and platform tools
        uses: actions/cache@v4
        with:
          path: |
            ~/solana-release
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}
      - name: Install Solana CLI
        run: |
          if [ ! -x ~/solana-release/bin/cargo-build-sbf ]; then
            curl -sSfL -o /tmp/solana.tar.bz2 "https://github.com/anza-xyz/agave/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
            tar xjf /tmp/solana.tar.bz2 -C ~
          fi
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
      # Every built transaction is signed and executed on the real program in LiteSVM.
      - run: make build
      # Node 24: Node 20 and 22 abort inside V8's GC with LiteSVM on GitHub's runners (PR #6).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/load/package-lock.json
      - name: Install the harness and the services it runs in-process
        run: |
          (cd tests/load && npm ci)
          (cd scripts && npm ci)
          (cd services/automation && npm ci)
          (cd services/indexer && npm ci)
          (cd services/pg-writer && npm ci)
          (cd services/api && npm ci)
          (cd services/txb && npm ci)
          (cd services/ws && npm ci)
      - run: npx tsc --noEmit -p .
        working-directory: tests/load
      - name: Load harness
        run: npx vitest run
        working-directory: tests/load
        env:
          LOAD_SCALE: ${{ inputs.scale || '5' }}
          TEST_REDIS_URL: redis://localhost:6379
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: tests/load/out/
