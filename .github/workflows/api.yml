name: api

on:
  pull_request:
    paths: ["services/api/**", "services/shared/**", "services/indexer/src/projector.ts", "services/indexer/test/fixtures/**", "db/migrations/**", "programs/meridian/idl/**", ".github/workflows/api.yml"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Node 24: Node 20 and 22 abort inside V8's GC on GitHub's runners (PR #6).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
        working-directory: services/api
      - run: npm run typecheck
        working-directory: services/api
      # The read model is the recorded day replayed through the real Indexer projector.
      - name: Tests (markets, me, admin)
        run: npx vitest run
        working-directory: services/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379
          REQUIRE_PG: "1"
          REQUIRE_REDIS: "1"
