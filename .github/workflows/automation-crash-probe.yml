# TEMPORARY: probes the std::bad_alloc abort in the automation LiteSVM suites. Removed before merge.
name: automation-crash-probe

on:
  pull_request:
    paths: [".github/workflows/automation-crash-probe.yml", "services/automation/test/helpers/**"]

env:
  SOLANA_VERSION: v2.3.13

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: baseline, node: 22, opts: "", err: "" }
          - { name: no-pretenuring, node: 22, opts: "--no-allocation-site-pretenuring", err: "" }
          - { name: err-string, node: 22, opts: "", err: "string" }
          - { name: node24-full, node: 24, opts: "", err: "", files: "test" }
          - { name: node20, node: 20, opts: "", err: "" }
          - { name: node24, node: 24, opts: "", err: "" }
          - { name: malloc-check, node: 22, opts: "", err: "", malloc: "1" }
    name: probe (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana CLI and platform tools
        uses: actions/cache@v4
        with:
          path: |
            ~/solana-release
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}
      - name: Install Solana CLI
        run: |
          if [ ! -x ~/solana-release/bin/cargo-build-sbf ]; then
            curl -sSfL -o /tmp/solana.tar.bz2 "https://github.com/anza-xyz/agave/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
            tar xjf /tmp/solana.tar.bz2 -C ~
          fi
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
      - run: make build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: services/automation
      - name: settler suite x3
        working-directory: services/automation
        env:
          REQUIRE_PROGRAM: "1"
          NODE_OPTIONS: ${{ matrix.opts }}
          SVM_ERR_MODE: ${{ matrix.err }}
        run: |
          node -v
          if [ "${{ matrix.malloc }}" = "1" ]; then
            export LD_PRELOAD=/lib/x86_64-linux-gnu/libc_malloc_debug.so.0 MALLOC_CHECK_=3
          fi
          set +e
          rc=0
          files="${{ matrix.files }}"
          for i in 1 2 3; do
            npx vitest run ${files:-test/settler.test.ts} --reporter=verbose > out.$i.log 2>&1; r=$?
            echo "run $i exit $r"; grep -E "✓|×|bad_alloc|free\(\)|corrupt|Tests " out.$i.log | tail -25
            [ $r -ne 0 ] && rc=1
          done
          exit $rc
