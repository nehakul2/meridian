name: automation

on:
  pull_request:
    paths: ["services/automation/**", "db/migrations/**", "programs/meridian/idl/**", "programs/**", ".github/workflows/automation.yml"]
  push:
    branches: [main]

env:
  SOLANA_VERSION: v2.3.13

jobs:
  test:
    # Pinned: on the newer ubuntu-latest image (glibc 2.43) Node 22 aborted with std::bad_alloc
    # inside V8's minor GC (PretenuringHandler rehash) during the LiteSVM suites. 24.04 is the
    # image the suite is developed and passes on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana CLI and platform tools
        uses: actions/cache@v4
        with:
          path: |
            ~/solana-release
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}
      - name: Install Solana CLI
        run: |
          if [ ! -x ~/solana-release/bin/cargo-build-sbf ]; then
            curl -sSfL -o /tmp/solana.tar.bz2 "https://github.com/anza-xyz/agave/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
            tar xjf /tmp/solana.tar.bz2 -C ~
          fi
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
      # The LiteSVM suites run the real program, so build it first.
      - run: make build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/automation/package-lock.json
      - run: npm ci
        working-directory: services/automation
      - run: npm run typecheck
        working-directory: services/automation
      - name: Runner details
        run: |
          nproc; free -m; ulimit -a; cat /proc/sys/vm/overcommit_memory
          grep -m1 "model name" /proc/cpuinfo; node -v
      # One test file at a time with the verbose reporter, so a native crash in a worker
      # names the file and test it happened in.
      - name: Tests (unit, Postgres, LiteSVM)
        run: npx vitest run --no-file-parallelism --reporter=verbose
        working-directory: services/automation
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REQUIRE_PROGRAM: "1"
          REQUIRE_PG: "1"
      # Diagnostics for the std::bad_alloc abort seen only on GitHub's runners: rerun the
      # test it happens in under gdb and print the native stack. The job stays failed.
      - name: Native backtrace of the crash (on failure)
        if: failure()
        working-directory: services/automation
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REQUIRE_PROGRAM: "1"
        run: |
          command -v gdb || (sudo apt-get update -qq && sudo apt-get install -y -qq gdb)
          gdb -batch -ex "set pagination off" -ex "handle SIGUSR1 SIGUSR2 SIGPIPE nostop noprint" -ex run -ex "bt 60" \
            --args node node_modules/vitest/vitest.mjs run test/settler.test.ts --pool=threads -t "SJ-02" || true
