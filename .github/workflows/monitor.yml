name: monitor

# MER-81 SLA and health alerting.
on:
  pull_request:
    paths: ["services/monitor/**", "services/automation/src/time.ts", "db/migrations/**", ".github/workflows/monitor.yml"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/monitor/package-lock.json
      - run: npm ci
        working-directory: services/monitor
      - run: npm run typecheck
        working-directory: services/monitor
      - run: npx vitest run
        working-directory: services/monitor
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          REQUIRE_PG: "1"
