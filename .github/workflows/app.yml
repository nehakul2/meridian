name: app

on:
  pull_request:
    paths: ["app/**", "services/shared/**", ".github/workflows/app.yml"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Node 24: Node 20 and 22 abort inside V8's GC on GitHub's runners (PR #6).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Component tests (MER-70 to MER-75)
        run: npx vitest run
      - run: npx next build
      - run: npx playwright install --with-deps chromium
      # Playwright starts the stub backend (dev/stub-server.ts) and serves the static export.
      - name: End-to-end (MER-76)
        run: npx playwright test e2e/frontend.spec.ts --trace retain-on-failure
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
