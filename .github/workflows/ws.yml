name: ws

on:
  pull_request:
    paths: ["services/ws/**", "services/shared/**", "services/indexer/src/projector.ts", "services/indexer/test/fixtures/**", ".github/workflows/ws.yml"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/ws/package-lock.json
      - run: npm ci
        working-directory: services/ws
      - run: npm run typecheck
        working-directory: services/ws
      - name: Tests (gateway)
        run: npx vitest run
        working-directory: services/ws
        env:
          TEST_REDIS_URL: redis://localhost:6379
          REQUIRE_REDIS: "1"
