name: program

on:
  pull_request:
    paths: ["programs/**", "Cargo.toml", "Cargo.lock", "Anchor.toml", ".github/workflows/program.yml"]
  push:
    branches: [main]

env:
  SOLANA_VERSION: v2.3.13
  ANCHOR_VERSION: 0.31.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Solana CLI and platform tools
        uses: actions/cache@v4
        with:
          path: |
            ~/solana-release
            ~/.cache/solana
          key: solana-${{ env.SOLANA_VERSION }}
      - name: Install Solana CLI
        run: |
          if [ ! -x ~/solana-release/bin/cargo-build-sbf ]; then
            curl -sSfL -o /tmp/solana.tar.bz2 "https://github.com/anza-xyz/agave/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
            tar xjf /tmp/solana.tar.bz2 -C ~
          fi
          echo "$HOME/solana-release/bin" >> "$GITHUB_PATH"
      - name: Install anchor-cli
        run: |
          if ! anchor --version 2>/dev/null | grep -q "$ANCHOR_VERSION"; then
            cargo install anchor-cli --version "$ANCHOR_VERSION" --locked
          fi
      - run: make doctor
      - run: make build
      - name: IDL drift check
        run: make idl-check
      - name: Fail on ignored tests without a ticket
        run: |
          if grep -RIn "#\[ignore\]" programs/ | grep -v "MER-"; then echo "ignored test without a MER ticket"; exit 1; fi
      - name: Program tests (LiteSVM, 10k property sequences)
        run: cargo test -p meridian
